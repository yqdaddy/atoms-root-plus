name: Deploy to Server

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build backend
        run: npm run build:server

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend
        run: |
          rsync -avz --delete dist/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.FRONTEND_PATH }}/

      - name: Deploy backend
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='data' \
            --exclude='node_modules' \
            --exclude='logs' \
            dist-server/ package.json package-lock.json .env.example ecosystem.config.js \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.BACKEND_PATH }}/

          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            mkdir -p ${{ secrets.BACKEND_PATH }}/data
            chmod 700 ${{ secrets.BACKEND_PATH }}/data

            if [ ! -f ${{ secrets.BACKEND_PATH }}/.env ]; then
              cp ${{ secrets.BACKEND_PATH }}/.env.example ${{ secrets.BACKEND_PATH }}/.env
              echo '请编辑 .env 填入 LLM_API_KEY'
            fi
          "

      - name: Install and restart (low memory optimized)
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            cd ${{ secrets.BACKEND_PATH }}
            npm install --production --no-optional

            # 使用 ecosystem.config.js 启动（限制内存 128MB 堆）
            pm2 delete atoms-backend 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save
          "

      - name: Verify
        run: |
          echo "✅ https://atoms.litpp.com"
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            sleep 2
            curl -s http://localhost:3000/api/health
            echo
            echo '内存占用:'
            pm2 show atoms-backend | grep -E 'memory|cpu' || true
          "