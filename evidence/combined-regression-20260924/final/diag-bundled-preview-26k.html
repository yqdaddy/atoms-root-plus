  <title>任务清单</title>
  <style>
:root {
  --bg-primary: #0f172a;
  --bg-card: #1e293b;
  --bg-card-hover: #334155;
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --danger: #ef4444;
  --danger-hover: #dc2626;
  --success: #22c55e;
  --border: #334155;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  --radius: 12px;
  --transition: 150ms ease;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: system-ui, "PingFang SC", sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 2rem 1rem;
}

.app-container {
  width: 100%;
  max-width: 520px;
}

.app-title {
  font-size: 1.75rem;
  font-weight: 700;
  text-align: center;
  margin-bottom: 1.5rem;
  letter-spacing: -0.02em;
}

.stats-bar {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  margin-bottom: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.stats-text {
  font-size: 0.9375rem;
  color: var(--text-secondary);
}

.stats-highlight {
  color: var(--success);
  font-weight: 600;
}

.add-task-form {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 0.75rem;
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.input-field {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-size: 1rem;
  padding: 0.5rem 0.75rem;
}

.input-field::placeholder {
  color: var(--text-secondary);
  opacity: 0.6;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.375rem;
  padding: 0.625rem 1rem;
  border: none;
  border-radius: 8px;
  font-size: 0.9375rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  min-height: 44px;
  min-width: 44px;
}

.btn-primary {
  background: var(--accent);
  color: white;
}

.btn-primary:hover {
  background: var(--accent-hover);
  filter: brightness(1.1);
  transform: scale(1.02);
}

.btn-primary:active {
  transform: scale(0.98);
}

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.btn-danger {
  background: transparent;
  color: var(--danger);
  padding: 0.5rem;
  border-radius: 6px;
}

.btn-danger:hover {
  background: rgba(239, 68, 68, 0.1);
  filter: brightness(1.1);
}

.task-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.task-item {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 0.875rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  transition: all var(--transition);
  animation: slideIn 200ms ease;
}

.task-item:hover {
  background: var(--bg-card-hover);
}

.task-item.removing {
  animation: slideOut 200ms ease forwards;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideOut {
  from {
    opacity: 1;
    transform: translateX(0);
  }
  to {
    opacity: 0;
    transform: translateX(20px);
  }
}

.checkbox-wrapper {
  display: flex;
  align-items: center;
}

.custom-checkbox {
  width: 22px;
  height: 22px;
  border: 2px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  flex-shrink: 0;
}

.custom-checkbox:hover {
  border-color: var(--accent);
}

.custom-checkbox.checked {
  background: var(--success);
  border-color: var(--success);
}

.custom-checkbox.checked::after {
  content: "✓";
  color: white;
  font-size: 14px;
  font-weight: 700;
}

.task-text {
  flex: 1;
  font-size: 1rem;
  transition: all var(--transition);
  word-break: break-word;
}

.task-text.completed {
  text-decoration: line-through;
  color: var(--text-secondary);
  opacity: 0.6;
}

.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-secondary);
}

.empty-state-icon {
  font-size: 3rem;
  margin-bottom: 0.75rem;
  opacity: 0.5;
}

.empty-state-text {
  font-size: 1rem;
}

.confirm-dialog {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  animation: fadeIn 150ms ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.dialog-content {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 1.5rem;
  max-width: 320px;
  width: 90%;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  animation: dialogScale 200ms ease;
}

@keyframes dialogScale {
  from {
    opacity: 0;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.dialog-title {
  font-size: 1.125rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.dialog-message {
  color: var(--text-secondary);
  font-size: 0.9375rem;
  margin-bottom: 1.25rem;
}

.dialog-actions {
  display: flex;
  gap: 0.75rem;
  justify-content: flex-end;
}

.btn-cancel {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.btn-cancel:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
}

.btn-confirm-delete {
  background: var(--danger);
  color: white;
}

.btn-confirm-delete:hover {
  background: var(--danger-hover);
  filter: brightness(1.1);
  transform: scale(1.02);
}

.btn-confirm-delete:active {
  transform: scale(0.98);
}
</style>
